name: health_tracker_pro
description: "Health Tracker Pro - Smart Health Monitoring Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Charts
  fl_chart: ^0.70.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Preferences
  shared_preferences: ^2.5.3

  # Date/Time formatting
  intl: ^0.20.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Crypto (SHA256 for passwords)
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
